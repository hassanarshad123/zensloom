<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Zensloom</title>
<meta name="referrer" content="no-referrer" />
<style>
  :root { --indigo:#6366f1; --pink:#ec4899; --bg:#0b0b12; --fg:#f5f5f7; --muted:#9ca3af; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
  .wrap { display:flex; flex-direction:column; height:100%; }
  header { display:flex; align-items:center; gap:8px; padding:10px 14px; }
  .mark { width:22px; height:22px; border-radius:7px;
    background:linear-gradient(135deg,var(--indigo),var(--pink));
    display:flex; align-items:center; justify-content:center; flex:0 0 auto; }
  .mark span { width:7px; height:7px; border-radius:50%; background:#fff; }
  .brand { font-weight:700; letter-spacing:-0.3px; font-size:15px; }
  .stage { flex:1; min-height:0; display:flex; align-items:center; justify-content:center;
    background:#000; }
  video { width:100%; height:100%; max-height:100%; background:#000; outline:none; }
  footer { display:flex; align-items:center; justify-content:space-between;
    padding:8px 14px; font-size:12px; color:var(--muted); }
  footer a { color:var(--fg); text-decoration:none; padding:5px 10px; border-radius:8px;
    border:1px solid rgba(255,255,255,.14); }
  footer a:hover { background:rgba(255,255,255,.08); }
  .err { padding:40px 20px; text-align:center; color:var(--muted); line-height:1.6; }
  .err b { color:var(--fg); }
  /* In a small iframe, hide chrome so the video fills the frame. */
  @media (max-height: 240px) { header, footer { display:none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="mark"><span></span></div>
    <div class="brand">Zensloom</div>
  </header>
  <div class="stage" id="stage"></div>
  <footer>
    <span>Recorded with Zensloom</span>
    <a id="dl" href="#" download>Download</a>
  </footer>
</div>
<script>
  (function () {
    // Only allow a safe id: letters, numbers, dash, underscore.
    var params = new URLSearchParams(location.search);
    var raw = params.get("v") || "";
    var id = raw.replace(/[^a-zA-Z0-9_-]/g, "");
    var stage = document.getElementById("stage");
    if (!id) {
      stage.innerHTML = '<div class="err"><b>No video specified.</b><br>This link is missing a video id.</div>';
      document.getElementById("dl").style.display = "none";
      return;
    }
    // player.html and the videos live in the same bucket: shares/<id>.mp4
    var src = "shares/" + id + ".mp4";
    var v = document.createElement("video");
    v.setAttribute("controls", "");
    v.setAttribute("playsinline", "");
    v.setAttribute("preload", "metadata");
    v.src = src;
    v.onerror = function () {
      stage.innerHTML = '<div class="err"><b>Video unavailable.</b><br>It may have been removed or the link is incorrect.</div>';
      document.getElementById("dl").style.display = "none";
    };
    stage.appendChild(v);
    document.getElementById("dl").href = src;
  })();
</script>
</body>
</html>
