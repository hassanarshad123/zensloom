[package]
name = "zensloom-desktop"
version = "0.5.0"
description = "Beautiful screen recordings, owned by you."
authors = ["you"]
edition = "2024"

[lints]
workspace = true

[lib]
name = "zensloom_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2.1.0", features = [] }

# macOS build-dependencies removed - Windows only

[dependencies]
tauri = { workspace = true, features = [
    "macos-private-api",
    "protocol-asset",
    "tray-icon",
    "image-png",
] }
tauri-specta = { version = "=2.0.0-rc.20", features = ["derive", "typescript"] }
tauri-plugin-dialog = "2.2.0"
tauri-plugin-fs = "2.2.0"
tauri-plugin-global-shortcut = "2.2.0"
tauri-plugin-http = "2.2.0"
tauri-plugin-notification = "2.2.0"
tauri-plugin-os = "2.2.0"
tauri-plugin-process = "2.2.0"
tauri-plugin-shell = "2.2.0"
tauri-plugin-single-instance = { version = "2.2.0", features = ["deep-link"] }
tauri-plugin-store = "2.2.0"
tauri-plugin-updater = "2.9.0"
# tauri-plugin-oauth removed - no auth in v1.0
tauri-plugin-window-state = "2.2.0"
tauri-plugin-positioner = "2.2.0"
tauri-plugin-deep-link = "2.2.0"
tauri-plugin-clipboard-manager = "2.2.1"
tauri-plugin-opener = "2.2.6"

serde = { workspace = true }
serde_json = "1.0.111"
specta.workspace = true
specta-typescript = "0.0.7"
tokio = { workspace = true, features = ["signal"] }
uuid = { version = "1.10.0", features = ["v4"] }
image = "0.25.2"
futures-intrusive = "0.5.0"
anyhow.workspace = true
futures = { workspace = true }
axum = { version = "0.7.5", features = ["ws", "macros"] }
tracing.workspace = true
tempfile = "3.9.0"
ffmpeg.workspace = true
chrono = { version = "0.4.31", features = ["serde"] }
regex = "1.10.4"
rodio = "0.19.0"
png = "0.17.13"
device_query = "4.0.1"
base64 = "0.22.1"
reqwest = { version = "0.12.24", features = ["json", "stream", "multipart"] }
dotenvy_macro = "0.15.7"
global-hotkey = "0.7.0"
rand = "0.8.5"
cpal.workspace = true
keyed_priority_queue = "0.4.2"
# sentry removed - zero telemetry policy
clipboard-rs = "0.2.2"
whisper-rs = "0.11.0"
lazy_static = "1.4.0"
log = "0.4.20"

zensloom-secrets = { path = "../../../crates/secrets" }
zensloom-audio = { path = "../../../crates/audio" }
zensloom-camera = { path = "../../../crates/camera", features = ["serde", "specta"] }
zensloom-segment = { path = "../../../crates/camera-effects" }
zensloom-utils = { path = "../../../crates/utils" }
zensloom-project = { path = "../../../crates/project" }
zensloom-rendering = { path = "../../../crates/rendering" }
zensloom-editor = { path = "../../../crates/editor" }
zensloom-media = { path = "../../../crates/media" }
zensloom-flags = { path = "../../../crates/flags" }
zensloom-recording = { path = "../../../crates/recording" }
zensloom-export = { path = "../../../crates/export" }
zensloom-enc-ffmpeg = { path = "../../../crates/enc-ffmpeg" }
zensloom-media-info = { path = "../../../crates/media-info" }
scap-targets = { path = "../../../crates/scap-targets" }
# scap-screencapturekit removed - macOS only
scap-direct3d = { path = "../../../crates/scap-direct3d" }

flume.workspace = true
tracing-subscriber = "0.3.19"
tracing-appender = "0.2.3"
dirs = "6.0.0"
relative-path = "1.9.3"
zensloom-fail = { version = "0.1.0", path = "../../../crates/fail" }
tokio-stream = { version = "0.1.17", features = ["sync"] }
md5 = "0.7.0"
tokio-util = "0.7.15"
wgpu.workspace = true
pollster = "0.4"
bytemuck = "1.23.1"
kameo = "0.17.2"
# tauri-plugin-sentry removed - zero telemetry policy
thiserror.workspace = true
bytes = "1.10.1"
async-stream = "0.3.6"
lz4_flex = "0.11"
sanitize-filename = "0.6.0"
tracing-futures = { version = "0.2.5", features = ["futures-03"] }
# opentelemetry and posthog removed - zero telemetry policy
sysinfo = "0.35"
workspace-hack = { version = "0.1", path = "../../../crates/workspace-hack" }
aho-corasick.workspace = true


# macOS dependencies removed - Windows only

[target.'cfg(not(all(target_os = "macos", target_arch = "x86_64")))'.dependencies]
parakeet-rs = "0.3.4"

[target.'cfg(target_os= "windows")'.dependencies]
windows = { workspace = true, features = [
    "Foundation",
    "Foundation_Collections",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_System",
    "Win32_System_Power",
    "Win32_System_WinRT",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
] }
windows-sys = { workspace = true }
winreg = "0.55"
webview2-com = "0.38.0"
windows-core = "0.61.2"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29.0", features = ["fs"] }

[dev-dependencies]
tauri = { workspace = true, features = ["test"] }
